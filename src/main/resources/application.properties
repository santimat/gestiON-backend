spring.application.name=proyecto-final
# Configuracion comun a todos los entornos. Los defaults de desarrollo (credenciales locales,
# logs verbosos, cookie sin Secure, CORS a localhost) viven en application-dev.properties y se
# activan con SPRING_PROFILES_ACTIVE=dev. Sin ese perfil, las variables sin default son obligatorias
# y la app no arranca si faltan: un despliegue nunca cae en un secreto publico del repo.
logging.level.org.springframework.security=INFO
# Database Connection
spring.datasource.url=${MYSQL_URL}
spring.datasource.username=${MYSQL_USERNAME}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA / Hibernate Settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
# Enums como VARCHAR (evita columnas ENUM en MySQL que ddl-auto=update no actualiza)
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR
spring.jpa.show-sql=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Detras de un reverse proxy con TLS: "native" o "framework" para respetar X-Forwarded-* (IP real
# del cliente para el rate limit del login, esquema https). "none" si la app recibe el trafico directo.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
# JWT Configuration (secret obligatorio, minimo 32 caracteres; vida por defecto 12 h)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:43200000}
# Cookie de sesion: Secure por defecto. SameSite=Lax alcanza si front y back comparten sitio;
# si estan en dominios distintos hace falta SameSite=None (que exige Secure=true).
app.auth.cookie.name=token
app.auth.cookie.secure=${COOKIE_SECURE:true}
app.auth.cookie.same-site=${COOKIE_SAME_SITE:Lax}
# Rate limit del login (cache en memoria, por instancia)
app.auth.login-rate-limit.max-attempts-per-ip=${LOGIN_MAX_ATTEMPTS_PER_IP:20}
app.auth.login-rate-limit.max-failures-per-email=${LOGIN_MAX_FAILURES_PER_EMAIL:5}
app.auth.login-rate-limit.window=${LOGIN_RATE_LIMIT_WINDOW:15m}
# CORS: origenes del front separados por coma (sin default: sin origenes no se habilita CORS)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# Minio configuration
minio.url=${MINIO_URL}
minio.bucket=${MINIO_BUCKET:gestionbucket}
minio.access-key=${MINIO_ACCESS_KEY}
minio.secret-key=${MINIO_SECRET_KEY}
minio.file.default-visibility=private
minio.dir.business-logos=business-logos
minio.dir.product-images=product-images
# Admin user credentials: si faltan email o password no se crea el usuario SUDO (sin defaults)
admin.name=${ADMIN_NAME:admin}
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}
