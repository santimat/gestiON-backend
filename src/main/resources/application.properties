spring.application.name=proyecto-final
logging.level.org.springframework.security=DEBUG
# Database Connection
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/gestion}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# JPA / Hibernate Settings
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# JWT Configuration
jwt.secret=${JWT_SECRET:Y2xhdmU5MTIxOGJpZW5MYXJnYVBhcmFRdWVOb01lVGlyZUV4Y2VwY2lvbmVz}
jwt.expiration=${JWT_EXPIRATION:86400000}
# Minio configuration
minio.url=${MINIO_URL:http://localhost:9000}
minio.bucket=${MINIO_BUCKET:gestionbucket}
minio.access-key=${MINIO_ACCESS_KEY:admin}
minio.secret-key=${MINIO_SECRET_KEY:admin123}
minio.file.default-visibility=private
minio.dir.business-logos=business-logos
minio.dir.product-images=product-images
# Admin user credentials
admin.name=${ADMIN_NAME:admin}
admin.email=${ADMIN_EMAIL:admin@admin.com}
admin.password=${ADMIN_PASSWORD:admin123}


