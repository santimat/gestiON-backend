# Perfil de desarrollo local (SPRING_PROFILES_ACTIVE=dev). Solo defaults pensados para la maquina
# del desarrollador: NUNCA activar este perfil en un entorno accesible desde afuera.
logging.level.org.springframework.security=DEBUG
spring.jpa.show-sql=true
# Database Connection
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/gestion}
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:admin}
# JWT (secret de desarrollo, publico en el repo)
jwt.secret=${JWT_SECRET:Y2xhdmU5MTIxOGJpZW5MYXJnYVBhcmFRdWVOb01lVGlyZUV4Y2VwY2lvbmVz}
# Cookie sin Secure: en local no hay TLS
app.auth.cookie.secure=${COOKIE_SECURE:false}
# Front de desarrollo (Vite)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Minio (docker-compose local)
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:admin}
minio.secret-key=${MINIO_SECRET_KEY:admin123}
# Admin SUDO de desarrollo
admin.email=${ADMIN_EMAIL:admin@admin.com}
admin.password=${ADMIN_PASSWORD:admin123}
