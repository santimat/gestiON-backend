services:
  minio:
    image: pgsty/minio:RELEASE.2026-02-14T12-00-00Z  # verifica el tag en Docker Hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      # mismas credenciales que usa la app; docker compose las lee del archivo .env (ver .env.example)
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Defini MINIO_ACCESS_KEY en .env}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Defini MINIO_SECRET_KEY en .env (minimo 8 caracteres)}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  minio-data: